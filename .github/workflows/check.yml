name: Check site updates

on:
  schedule:
    # 毎日 06:00 JST (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Node.js 24 で JavaScript actions を実行（非推奨警告の回避）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DISCORD_WEBHOOK_URL_ANTHROPIC: ${{ secrets.DISCORD_WEBHOOK_URL_ANTHROPIC }}
      DISCORD_WEBHOOK_URL_OPENAI: ${{ secrets.DISCORD_WEBHOOK_URL_OPENAI }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore state cache
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: rss-github-actions-to-discord-state-${{ github.run_id }}
          restore-keys: |
            rss-github-actions-to-discord-state-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Discord webhook secrets
        run: |
          missing=""
          [ -z "$DISCORD_WEBHOOK_URL_ANTHROPIC" ] && missing="$missing DISCORD_WEBHOOK_URL_ANTHROPIC"
          [ -z "$DISCORD_WEBHOOK_URL_OPENAI" ] && missing="$missing DISCORD_WEBHOOK_URL_OPENAI"
          if [ -n "$missing" ]; then
            echo "GitHub Secrets が未設定です:$missing"
            echo "Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi

      - name: Check feeds and notify Discord
        env:
          STATE_FILE: .state/last.json
        run: python scripts/check.py

      - name: Save state cache
        if: always() && hashFiles('.state/last.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state
          key: rss-github-actions-to-discord-state-${{ github.run_id }}
