name: Check site updates

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: .state
          key: rss-github-actions-to-discord-state-v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feeds and notify Discord
        env:
          DISCORD_WEBHOOK_URL_ANTHROPIC: ${{ secrets.DISCORD_WEBHOOK_URL_ANTHROPIC }}
          DISCORD_WEBHOOK_URL_OPENAI: ${{ secrets.DISCORD_WEBHOOK_URL_OPENAI }}
          STATE_FILE: .state/last.json
        run: python scripts/check.py
