# 監視するサイト一覧。
# company: GitHub Secret DISCORD_WEBHOOK_URL_<COMPANY> に対応
# type: rss（デフォルト）または page（HTML 一覧ページ）
sites:
  - company: anthropic
    name: Anthropic Engineering
    url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_engineering_rss.xml

  - company: anthropic
    name: Anthropic News
    url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_news_rss.xml

  - company: anthropic
    name: Claude Blog
    type: page
    url: https://claude.com/blog
    link_selector: a[href]
    link_path_regex: ^/blog/[^/?#]+/?$
    notify_on_first_run: true

  - company: openai
    name: OpenAI News (日本語)
    type: page
    url: https://openai.com/ja-JP/news/
